[project]
name = "FAgents"
version = "0.1.0"

description = "Python Agent Orchestration Framework"
readme = "README.md"

license = "Apache-2.0"
license-files = ["LICEN[CS]E.*"]

authors = [
  {name = "sysfab", email = "sysfab64@gmail.com"},
]

keywords = ["agents", "ai", "llm"]

requires-python = ">=3.14"
dependencies = [
    "filetype>=1.2.0",
    "openai-agents>=0.17.3",
]


[project.urls]
Repository = "https://github.com/sysfab/FAgents.git"


[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.43",
]
